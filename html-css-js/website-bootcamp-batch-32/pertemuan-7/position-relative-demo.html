<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative Position</title>

    <style>
        .container {
            margin-top: 5em;
            position: relative;
            width: 100px;
            background-color: lightgray;
        }
        .square {
            width: 100px;
            height: 100px;
            background-color: blue;
        }

        .circle {
            width: 40px;
            height: 40px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            z-index: 1;
            top: -20px;
            right: -10px;
            display: flex;
            justify-content: center;
            color: white;
        }

        .whatsapp {
            background-color: red;
            display: inline;
            position: absolute;
            bottom: 20px;
            right: 10px;
        }


    </style>
</head>
<body>
    <div class="whatsapp">
        Back to Top
    </div>
    <div class="container">
        <div class="square">
            
        </div>

        <div class="circle">
            <p>1</p>
        </div>
    </div>
</body>
</html>
