    <h1>Ini halaman index</h1>

    <h2>Daftar User</h2>
    <table border="1">
        <!-- Untuk baris judul, berisi nama kolom -->
        <thead>
            <tr>
                <th>No</th>
                <th>Nama User</th>
                <th>Umur</th>
                <th>Kota Asal</th>
            </tr>
        </thead>

        <!-- Untuk isi dari table -->

            <tr>

    <h3>Kirim Feedback Anda...</h3>

        <input type="radio" id="perempuan" name="gender1" value="P" />
        <label for="perempuan">Perempuan</label>
    </div>

    <!-- Dropdown -->
    <label for="kota">Kota:</label>
    <select id="kota" name="kota">
        <option value="">-- Pilih Kota --</option>
        <option value="jakarta">Jakarta</option>
        <option value="bandung">Bandung</option>
