<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contoh Kartu Profil</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1 class="judul-halaman">Contoh Tugas — Kartu Profil</h1>
  <p class="subjudul">Pertemuan 3: Basic CSS 1 · Haltev IT Learning Center</p>

  <!-- KARTU PROFIL -->
  <div class="card" id="profile-card">

    <!-- Foto Profil -->
    <img
      class="foto-profil"
      src="https://api.dicebear.com/7.x/adventurer/svg?seed=Haltev"
      alt="Foto Profil"
    />

    <!-- Nama dan Jabatan -->
    <h2 id="profile-name">Budi Santoso</h2>
    <p class="jabatan">Junior Web Developer</p>

    <!-- Garis pemisah -->
    <hr class="garis" />

    <!-- Deskripsi -->
    <p class="deskripsi">
      Halo! Saya sedang belajar web development di Haltev.
      Saya suka membuat tampilan website yang menarik dan rapi. 🚀
    </p>

    <!-- Tombol -->
    <div class="tombol-grup">
      <button class="btn btn-utama">Follow</button>
      <button class="btn btn-sekunder">Message</button>
    </div>

  </div>

</body>
</html>
