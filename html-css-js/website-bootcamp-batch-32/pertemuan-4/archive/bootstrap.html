<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        /* Sesuaikan tinggi (height) sesuai keinginanmu, misal 400px atau 50vh */
        .carousel-item img {
            height: 400px;
            object-fit: cover;
            /* Ini kuncinya supaya gambar terpotong rapi, bukan gepeng */
            object-position: center;
            /* Gambar akan tetap di tengah saat terpotong */
        }

        /* Opsional: Untuk tampilan mobile agar tingginya lebih kecil */
        @media (max-width: 768px) {
            .carousel-item img {
                height: 250px;
            }
        }
    </style>

</head>

<body>
    <h1>Hello, world!</h1>

    <button class="btn btn-primary">Test</button>

    <div class="card" style="width: 18rem;">
        <img src="https://down-id.img.susercontent.com/file/id-11134207-7ra0j-mbopxo9l0ej7f1.webp" class="card-img-top"
            alt="...">
        <div class="card-body">
            <h5 class="card-title">Tas Branded</h5>
            <h5 class="card-title">Rp. 900.000</h5>
            <p class="card-text">Tas branded yang sangat bagus dan murah!</p>
            <a href="#" class="btn btn-primary">Beli Sekarang!</a>
        </div>
    </div>

    <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
        </div>
    
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://down-id.img.susercontent.com/file/id-11134207-7rbke-m6qexmvl8wvgae@resize_w900_nl.webp"
                    class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Slide 1">
            </div>
            <div class="carousel-item">
                <img src="https://down-id.img.susercontent.com/file/id-11134207-7rbk3-mas3zg9y2yes30@resize_w900_nl.webp"
                    class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Slide 2">
            </div>
            <div class="carousel-item">
                <img src="https://down-id.img.susercontent.com/file/id-11134207-7r98p-lr5cuympzwo735@resize_w900_nl.webp"
                    class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Slide 3">
            </div>
        </div>
    
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
