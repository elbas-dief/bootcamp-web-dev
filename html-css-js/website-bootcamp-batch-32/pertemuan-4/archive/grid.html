        .page-layout {
            display: grid;

            grid-template-rows: 80px auto 60px;

            gap: 0;
        }

        .header {
            grid-column: span 2;
            /* header penuh memanjang 2 kolom */
            background: #1a1a2e;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 24px;
        }

        .sidebar {
            background: #f0f0f0;
            padding: 20px;
        }

        .content {
            padding: 20px;
        }

        .footer {
            grid-column: span 2;
            background: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
